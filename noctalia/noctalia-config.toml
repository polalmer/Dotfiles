[bar.default]
background_opacity = 0.89999997988343239
concave_edge_corners = false
end = [ "media", "tray", "notifications", "clipboard", "network", "bluetooth", "volume", "battery", "spacer_2", "session" ]
margin_edge = 0
margin_ends = 0
radius_bottom_left = 10
radius_bottom_right = 10
radius_top_left = 0
radius_top_right = 0
start = [ "launcher", "workspaces" ]

[lockscreen]
transition = [ "crt" ]
transition_duration = 1000

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-2", "lockscreen-login-box@DP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 196.0
    box_width = 720.0
    cx = 1280.0
    cy = 1080.0
    output = "DP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-2"]
    box_height = 196.0
    box_width = 720.0
    cx = 1280.0
    cy = 1321.0
    output = "DP-2"
    placement_height = 0.0
    placement_width = 0.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-2".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 1280.0
    cy = 1481.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true

[shell]
font_family = "FixedsysExcelsior Nerd Font"

    [shell.launcher]
    app_grid = true
    default_view = "categories"
    pinned = [ "steam", "net.lutris.Lutris", "firefox", "discord" ]
    show_session_button = false
    show_settings_button = false
    track_usage = false

        [shell.launcher.providers.calculator]
        global = false

[theme]
community_palette = "Cream"
source = "community"
wallpaper_scheme = "vibrant"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "kcolorscheme" ]

[wallpaper]
directory = "/home/polalmer/Dotfiles"

    [wallpaper.default]
    path = "/home/polalmer/Dotfiles/background.jpg"

    [wallpaper.last]
    path = "/home/polalmer/Dotfiles/background.jpg"

[widget.media]
hide_when_no_media = true

[widget.network]
show_label = false

[widget.spacer_2]
type = "spacer"

[widget.workspaces]
hide_when_empty = true
