[font]
size = 12.0

[font.bold]
family = "FixedsysExcelsior Nerd Font"
style = "Bold"

[font.bold_italic]
family = "FixedsysExcelsior Nerd Font"
style = "Bold Italic"

[font.italic]
family = "FixedsysExcelsior Nerd Font"
style = "Italic"

[font.normal]
family = "FixedsysExcelsior Nerd Font"
style = "Regular"

[colors.cursor]
text = "#1c1b19"
cursor = "#87cefa"

[colors.selection]
text = "#1c1b19"
background = "#fce8c3"

[colors.primary]
foreground = "#ECE1D7"
background = "#292522"

[colors.normal]
black      = "#34302C"
red        = "#D47766"
green      = "#78997A"
yellow     = "#E49B5D"
blue       = "#7F91B2"
magenta    = "#B380B0"
cyan       = "#7B9695"
white      = "#C1A78E"

[colors.bright]
black      = "#867462"
red        = "#BD8183"
green      = "#85B695"
yellow     = "#EBC06D"
blue       = "#A3A9CE"
magenta    = "#CF9BC2"
cyan       = "#89B3B6"
white      = "#ECE1D7"

[keyboard]
bindings = [
]

[window]
padding={x=2,y=2}

[mouse]
hide_when_typing=true

