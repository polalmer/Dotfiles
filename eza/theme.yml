# Melange like palette
palette:
  fg: &fg "#ECE1D7"
  dim: &dim "#867462"
  red: &red "#BD8183"
  red_bright: &red_bright "#D47766"
  green: &green "#78997A"
  green_bright: &green_bright "#85B695"
  yellow: &yellow "#E49B5D"
  yellow_bright: &yellow_bright "#EBC06D"
  blue: &blue "#7F91B2"
  blue_bright: &blue_bright "#A3A9CE"
  magenta: &magenta "#B380B0"
  magenta_bright: &magenta_bright "#CF9BC2"
  cyan: &cyan "#7B9695"
  cyan_bright: &cyan_bright "#89B3B6"
  tan: &tan "#C1A78E"

filekinds:
  normal: {foreground: *fg}
  directory: {foreground: *blue_bright}
  symlink: {foreground: *cyan_bright}
  pipe: {foreground: *yellow}
  block_device: {foreground: *yellow}
  char_device: {foreground: *yellow}
  socket: {foreground: *magenta}
  special: {foreground: *magenta}
  executable: {foreground: *green_bright}
  mount_point: {foreground: *cyan}

users:
  user_you: {foreground: *yellow_bright}
  user_root: {foreground: *red_bright, is_bold: true}
  user_other: {foreground: *fg}
  group_yours: {foreground: *cyan_bright}
  group_other: {foreground: *dim}
  group_root: {foreground: *red_bright}

perms:
  user_read: {foreground: *yellow_bright}
  user_write: {foreground: *red}
  user_execute_file: {foreground: *green_bright}
  user_execute_other: {foreground: *green_bright}
  group_read: {foreground: *cyan}
  group_write: {foreground: *magenta}
  group_execute: {foreground: *green}
  other_read: {foreground: *dim}
  other_write: {foreground: *dim}
  other_execute: {foreground: *dim}
  special_user_file: {foreground: *red_bright}
  special_other: {foreground: *red_bright}
  attribute: {foreground: *dim}

size:
  major: {foreground: *yellow}
  minor: {foreground: *yellow}
  number_byte: {foreground: *yellow}
  number_kilo: {foreground: *yellow}
  number_mega: {foreground: *yellow}
  number_giga: {foreground: *yellow}
  number_huge: {foreground: *yellow}
  unit_byte: {foreground: *dim}
  unit_kilo: {foreground: *dim}
  unit_mega: {foreground: *dim}
  unit_giga: {foreground: *dim}
  unit_huge: {foreground: *dim}

git:
  new: {foreground: *green_bright}
  modified: {foreground: *yellow_bright}
  deleted: {foreground: *red_bright}
  renamed: {foreground: *magenta_bright}
  ignored: {foreground: *dim}
  conflicted: {foreground: *red_bright, is_bold: true}

git_repo:
  branch_main: {foreground: *blue_bright, is_bold: true}
  branch_other: {foreground: *magenta}
  git_clean: {foreground: *green_bright}
  git_dirty: {foreground: *yellow_bright}

file_type:
  image: {foreground: *magenta_bright}
  video: {foreground: *red}
  music: {foreground: *cyan_bright}
  crypto: {foreground: *green_bright}
  document: {foreground: *fg}
  compressed: {foreground: *red_bright}
  temp: {foreground: *dim, is_dimmed: true}
  compiled: {foreground: *yellow}
  build: {foreground: *yellow, is_underline: true}
  source: {foreground: *blue_bright}

date: {foreground: *dim}
header: {foreground: *yellow_bright, is_bold: true}
punctuation: {foreground: *dim}
broken_symlink: {foreground: *red_bright}
broken_path_overlay: {foreground: *red_bright}
control_char: {foreground: *magenta}
