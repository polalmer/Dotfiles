# use noctalia shell v5
exec_once=noctalia

#scale for macbook
monitor_rule=name:^eDP-1$,width:2560,height:1600,refresh:60,scale:1.5
#main monitor home
monitor_rule=model:AOC 24G2W1G3,width:1920,height:1080,refresh:165,scale:1

# Overview Setting
hotarea_size=10
enable_hotarea=0

# Misc
no_border_when_single=1
axis_bind_apply_timeout=100
focus_on_activate=1
sloppy_focus=0
warp_cursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=24
drag_tile_to_tile=1
drag_tile_small=1

# keyboard
repeat_rate=25
repeat_delay=600
numlock_on=0
xkb_rules_layout=us

# Trackpad
# need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=0
drag_lock=1
trackpad_natural_scrolling=1
trackpad_disable_while_typing=1
trackpad_middle_button_emulation=0
swipe_min_threshold=1

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tag_rule=id:1,layout_name:fair
tag_rule=id:2,layout_name:fair
tag_rule=id:3,layout_name:fair
tag_rule=id:4,layout_name:fair
tag_rule=id:5,layout_name:fair
tag_rule=id:6,layout_name:fair
tag_rule=id:7,layout_name:fair
tag_rule=id:8,layout_name:fair
tag_rule=id:9,layout_name:fair

#Import other files
source=./keybind.conf
source=./styling.conf
